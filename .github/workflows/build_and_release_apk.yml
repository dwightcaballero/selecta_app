name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'pubspec.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Determine Version & Tag
        id: version_step
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/ //g')
          echo "Detected version from pubspec.yaml: $VERSION"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          COMMIT_MSG=$(git log -1 --pretty=%B)
          BODY=""
          if echo "$COMMIT_MSG" | grep -qi "\[force-update\]"; then
            BODY="[force-update] Critical update required for all users."
          elif echo "$COMMIT_MSG" | grep -qi "\[mandatory\]"; then
            BODY="[mandatory] This update is required to continue using Selecta Ops."
          fi
          echo "body=$BODY" >> $GITHUB_OUTPUT

      - name: Build Android Release APK (Split ABI for lightweight ~28MB APKs)
        run: flutter build apk --release --split-per-abi

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_step.outputs.tag }}
          name: "Release ${{ steps.version_step.outputs.tag }}"
          body: ${{ steps.version_step.outputs.body }}
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
