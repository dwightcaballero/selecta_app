name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'pubspec.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Determine Version & Tag
        id: version_step
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/ //g')
          echo "Detected version from pubspec.yaml: $VERSION"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$VERSION"
          fi
          VERSION_NAME="${VERSION%%+*}"
          BUILD_NUMBER="${VERSION##*+}"
          if [ "$BUILD_NUMBER" = "$VERSION" ]; then
            BUILD_NUMBER=0
          fi
          # Flutter's split-per-abi adds 2000 to versionCode for arm64-v8a APKs.
          # Use ARM64_BUILD so existing installed devices running 2000+ build codes detect the update.
          if [ "$BUILD_NUMBER" -gt 0 ]; then
            ARM64_BUILD=$((2000 + BUILD_NUMBER))
          else
            ARM64_BUILD=0
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "build=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "arm64_build=$ARM64_BUILD" >> $GITHUB_OUTPUT

          COMMIT_MSG=$(git log -1 --pretty=%B)
          TAG_MSG=$(git tag -l --format='%(contents)' "$TAG" 2>/dev/null || echo "")

          # Detect force update
          IS_FORCE=false
          if echo "$COMMIT_MSG" | grep -qi "\[force-update\]" || echo "$COMMIT_MSG" | grep -qi "\[mandatory\]" || echo "$TAG_MSG" | grep -qi "\[force-update\]" || echo "$TAG_MSG" | grep -qi "\[mandatory\]"; then
            IS_FORCE=true
          fi
          echo "force=$IS_FORCE" >> $GITHUB_OUTPUT

          # Extract release notes: prefer tag message body, fallback to commit body
          RAW_NOTES=""
          if [ -n "$TAG_MSG" ]; then
            RAW_NOTES="$TAG_MSG"
          else
            RAW_NOTES=$(git log -1 --pretty=%b)
          fi

          # Strip internal force/mandatory flags and clean leading/trailing whitespace
          CLEAN_NOTES=$(echo "$RAW_NOTES" | sed 's/\[force-update\]//gi; s/\[mandatory\]//gi' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
          if [ -z "$CLEAN_NOTES" ] || echo "$CLEAN_NOTES" | grep -qi "^chore(release): bump version"; then
            CLEAN_NOTES="• Performance improvements and bug fixes."
          fi

          if [ "$IS_FORCE" = true ]; then
            RELEASE_BODY="[force-update] Critical update required for all users.

$CLEAN_NOTES"
          else
            RELEASE_BODY="$CLEAN_NOTES"
          fi

          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> $GITHUB_OUTPUT

          {
            echo "release_notes<<EOF"
            echo "$CLEAN_NOTES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

          # Sanitize single-line header for HTTP metadata (RFC prohibits unescaped newlines)
          HEADER_NOTES=$(echo "$CLEAN_NOTES" | tr '\n' ' ' | sed 's/  */ /g' | cut -c1-500)
          echo "release_notes_header=$HEADER_NOTES" >> $GITHUB_OUTPUT

      - name: Configure Keystore & Signing Properties
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not configured. Falling back to debug signing."
          else
            echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            echo "Release keystore and key.properties configured successfully."
          fi

      - name: Build Android Release APK (Split ABI for lightweight ~28MB APKs)
        run: flutter build apk --release --split-per-abi

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_step.outputs.tag }}
          name: "Release ${{ steps.version_step.outputs.tag }}"
          body: ${{ steps.version_step.outputs.body }}
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to Google Cloud (Optional Firebase Storage)
        if: ${{ env.FIREBASE_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GCP_SA_KEY }}
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GCP_SA_KEY }}

      - name: Upload Release APK to Firebase Storage
        if: ${{ env.FIREBASE_KEY != '' }}
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          destination: selectaapp.firebasestorage.app/releases/
          # Custom metadata read by AppUpdateService._fetchFromFirebaseStorage.
          headers: |-
            cache-control: no-cache, max-age=0
            x-goog-meta-versionCode: ${{ steps.version_step.outputs.arm64_build }}
            x-goog-meta-versionName: ${{ steps.version_step.outputs.name }}
            x-goog-meta-forceUpdate: ${{ steps.version_step.outputs.force }}
            x-goog-meta-releaseNotes: ${{ steps.version_step.outputs.release_notes_header }}
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GCP_SA_KEY }}

      - name: Sync Firestore configurations/app_version
        if: ${{ env.FIREBASE_KEY != '' }}
        continue-on-error: true
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GCP_SA_KEY }}
          PROJECT_ID: selectaapp
          VERSION_NAME: ${{ steps.version_step.outputs.name }}
          BUILD_NUMBER: ${{ steps.version_step.outputs.arm64_build }}
          FORCE_UPDATE: ${{ steps.version_step.outputs.force }}
          RELEASE_NOTES: ${{ steps.version_step.outputs.release_notes }}
          TAG: ${{ steps.version_step.outputs.tag }}
        run: |
          TOKEN=$(gcloud auth print-access-token)
          TAG_ENC=$(printf '%s' "$TAG" | sed 's/+/%2B/g')
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_ENC}/app-arm64-v8a-release.apk"
          FILE_SIZE=$(stat -c%s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk)
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BODY=$(jq -n \
            --arg b "$BUILD_NUMBER" \
            --arg vn "$VERSION_NAME" \
            --arg url "$APK_URL" \
            --argjson f "$FORCE_UPDATE" \
            --arg fs "$FILE_SIZE" \
            --arg now "$NOW" \
            --arg rn "$RELEASE_NOTES" \
            '{
              fields: {
                latestVersionCode: {integerValue: $b},
                latestVersionName: {stringValue: $vn},
                apkUrl: {stringValue: $url},
                forceUpdate: {booleanValue: $f},
                fileSize: {integerValue: $fs},
                publishedAt: {timestampValue: $now},
                releaseNotes: {stringValue: $rn}
              }
            }')
          MASK="updateMask.fieldPaths=latestVersionCode&updateMask.fieldPaths=latestVersionName&updateMask.fieldPaths=apkUrl&updateMask.fieldPaths=forceUpdate&updateMask.fieldPaths=fileSize&updateMask.fieldPaths=publishedAt&updateMask.fieldPaths=releaseNotes"
          curl -sS --fail-with-body -X PATCH \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            "https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/configurations/app_version?${MASK}" \
            -d "$BODY"
